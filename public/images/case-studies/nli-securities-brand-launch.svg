<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Brand launch visual board</title>
  <desc id="desc">Abstract brand identity boards, office signage, and launch materials for a financial services brand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1236"/>
      <stop offset="0.45" stop-color="#1735dd"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#dfe8f5" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#06102a" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1320" cy="190" r="310" fill="#ffffff" opacity="0.18"/>
  <circle cx="270" cy="780" r="420" fill="#07102f" opacity="0.26"/>
  <g filter="url(#shadow)">
    <rect x="150" y="150" width="440" height="560" rx="34" fill="url(#card)"/>
    <rect x="206" y="214" width="190" height="28" rx="14" fill="#1735dd"/>
    <rect x="206" y="288" width="300" height="24" rx="12" fill="#0d1744" opacity="0.82"/>
    <rect x="206" y="342" width="230" height="18" rx="9" fill="#0d1744" opacity="0.42"/>
    <rect x="206" y="388" width="302" height="190" rx="24" fill="#ffffff" opacity="0.58"/>
    <path d="M244 526 C286 456 340 436 390 472 C430 500 464 500 504 452" fill="none" stroke="#1735dd" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="650" y="230" width="700" height="430" rx="36" fill="#08112f" opacity="0.82"/>
    <rect x="720" y="305" width="240" height="34" rx="17" fill="#ffffff" opacity="0.9"/>
    <rect x="720" y="386" width="500" height="22" rx="11" fill="#ffffff" opacity="0.46"/>
    <rect x="720" y="438" width="380" height="22" rx="11" fill="#ffffff" opacity="0.32"/>
    <rect x="720" y="530" width="160" height="58" rx="29" fill="#1735dd"/>
    <rect x="920" y="530" width="160" height="58" rx="29" fill="#ffffff" opacity="0.88"/>
  </g>
  <g opacity="0.75">
    <rect x="1150" y="690" width="180" height="180" rx="22" fill="#ffffff" opacity="0.32"/>
    <rect x="1210" y="740" width="60" height="80" rx="10" fill="#1735dd"/>
    <rect x="1320" y="735" width="110" height="135" rx="18" fill="#ffffff" opacity="0.2"/>
  </g>
