    <path d="M432 395 L720 374 L720 460 L432 486 Z" fill="url(#blue)"/>
    <rect x="872" y="398" width="300" height="210" rx="26" fill="#0b1236" opacity="0.9"/>
    <rect x="916" y="445" width="210" height="22" rx="11" fill="#ffffff" opacity="0.86"/>
    <rect x="916" y="502" width="170" height="18" rx="9" fill="#ffffff" opacity="0.48"/>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <circle cx="520" cy="180" r="22"/>
    <circle cx="812" cy="152" r="18"/>
    <circle cx="1110" cy="132" r="22"/>
  </g>
  <g opacity="0.75">
    <rect x="500" y="690" width="220" height="88" rx="22" fill="#1735dd"/>
    <rect x="928" y="642" width="280" height="92" rx="24" fill="#1735dd"/>
